<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whitalds — Residential Lettings | Coming Soon</title>
  <meta name="description" content="Whitalds is a lettings agency specialsing to residential rentals. Our new website is on its way — please check back soon." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>
<body>

  <!-- Scattered line-icon background (populated by main.js) -->
  <div class="pattern" aria-hidden="true">
    <div class="layer layer--far"></div>
    <div class="layer layer--near"></div>
    <div class="pattern__glow"></div>
  </div>

  <!-- Shared line-icon symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-house" viewBox="0 0 24 24">
        <path d="M3 11.5 12 3l9 8.5" /><path d="M5 10.5V21h5.5v-5.5h3V21H19V10.5" />
      </symbol>
      <symbol id="i-key" viewBox="0 0 24 24">
        <circle cx="7.5" cy="7.5" r="3.5" /><path d="M10.2 10.2 20 20" /><path d="M16.5 16.5 19 14" /><path d="M13.8 13.8l2 2" />
      </symbol>
      <symbol id="i-door" viewBox="0 0 24 24">
        <path d="M6.5 3.5h11V21h-11z" /><circle cx="14.8" cy="12.3" r="0.9" />
      </symbol>
      <symbol id="i-window" viewBox="0 0 24 24">
        <rect x="5" y="5" width="14" height="14" rx="1" /><path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-bed" viewBox="0 0 24 24">
        <path d="M3 18.5V7" /><path d="M3 14.5h18v4" /><path d="M3 16.5h18" /><path d="M6 14.5v-3h5v3" /><path d="M14.5 14.5v-2H19v2" />
      </symbol>
      <symbol id="i-sofa" viewBox="0 0 24 24">
        <path d="M5.5 11V8.5A2.5 2.5 0 0 1 8 6h8a2.5 2.5 0 0 1 2.5 2.5V11" /><path d="M4 12.5A1.5 1.5 0 0 1 5.5 11h13A1.5 1.5 0 0 1 20 12.5V17H4z" /><path d="M4 17v2.5M20 17v2.5M9.5 17v2.5M14.5 17v2.5" />
      </symbol>
      <symbol id="i-tub" viewBox="0 0 24 24">
        <path d="M4 12.5h16v2.5a4.5 4.5 0 0 1-4.5 4.5h-7A4.5 4.5 0 0 1 4 15z" /><path d="M7 19.5 6 22M17 19.5 18 22" /><path d="M8 12.5V6.8A1.8 1.8 0 0 1 9.8 5h.4" />
      </symbol>
      <symbol id="i-lamp" viewBox="0 0 24 24">
        <path d="M12 3.5 15.5 10h-7z" /><path d="M12 10v9" /><path d="M8.5 21.5h7" />
      </symbol>
      <symbol id="i-plant" viewBox="0 0 24 24">
        <path d="M8.5 13.5h7l-1 6.5h-5z" /><path d="M12 13.5c0-3.5-2.5-6-6-6 .5 3.5 2.5 6 6 6z" /><path d="M12 13.5c0-4 2.5-7 6.5-7-.5 4-2.5 7-6.5 7z" />
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect x="4.5" y="5.5" width="15" height="14" rx="1.5" /><path d="M4.5 10h15M8.5 3.5V7M15.5 3.5V7" /><path d="M8 14h2M14 14h2M8 17.5h2" />
      </symbol>
      <symbol id="i-sign" viewBox="0 0 24 24">
        <path d="M12 3v18" /><path d="M12 5h7.5v6H12" /><path d="M14 8h3.5" />
      </symbol>
      <symbol id="i-keytag" viewBox="0 0 24 24">
        <path d="M12.6 3.5H20.5v7.9L11 20.9a2 2 0 0 1-2.8 0l-5.1-5.1a2 2 0 0 1 0-2.8z" /><circle cx="15" cy="9" r="1.4" />
      </symbol>
    </defs>
  </svg>

  <main class="hero">
    <div class="hero__inner">
      <picture>
        <source srcset="assets/logo.webp" type="image/webp" />
        <img class="hero__logo" src="assets/logo.png" alt="Whitalds" width="1535" height="580" />
      </picture>
      <p class="hero__eyebrow">Residential Lettings &amp; Property Management</p>
      <h1 class="hero__title">Our new home<br />is almost ready.</h1>
      <p class="hero__copy hero__contact">
        Talk to us about your next home<br />
        <a id="contact-email" class="contact-link" data-e="aGVsbG9Ad2hpdGFsZHMuY29t" aria-label="Email Whitalds"><span aria-hidden="true">hello [at] whitalds [dot] com</span></a><br />
        <a id="contact-phone" class="contact-link" data-p="MDEyMTQ2MTQwOTI=" aria-label="Call Whitalds on 0121 461 4092"><span aria-hidden="true">0121<i class="obf">78</i> 461<i class="obf">5</i> 4092</span></a>
      </p>
      <noscript>
        <p class="hero__copy">Email hello [at] whitalds [dot] com or call 0121 461 4092.</p>
      </noscript>
      <p class="hero__soon">Please check back soon</p>
    </div>
  </main>

  <footer class="footer">
    <span>© Whitalds Ltd</span>
  </footer>

  <!-- Assemble contact links at runtime so the raw address/number never
       appears in the page source (basic anti-scraper obfuscation) -->
  <script>
    (function () {
      var email = document.getElementById('contact-email');
      if (email) {
        var addr = atob(email.getAttribute('data-e'));
        email.href = 'mailto:' + addr;
        email.textContent = addr;
      }
      var phone = document.getElementById('contact-phone');
      if (phone) {
        var num = atob(phone.getAttribute('data-p'));
        phone.href = 'tel:+44' + num.slice(1);
        phone.textContent = num.replace(/(\d{4})(\d{3})(\d{4})/, '$1 $2 $3');
      }
    })();
  </script>

</body>
</html>
